# Self-contained static page — no build step, no dependencies.
# Publish the repository root as-is; index.html is the whole app.
[build]
  publish = "."
  command = ""

# Photos are decoded and edited entirely in the browser, and edits are saved to
# the device by default. The only off-origin traffic is Google Drive, and only
# once the user connects it: accounts.google.com for sign-in, then the Drive API.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
